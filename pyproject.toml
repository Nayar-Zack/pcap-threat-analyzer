[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-threat-analyzer"
version = "0.1.0"
description = "A CLI tool for analyzing PCAP/PCAPNG captures and flagging suspicious network behavior with explainable heuristics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "scapy>=2.5",
    "rich>=13.0",
]

[project.scripts]
pcap-analyzer = "pcap_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["pcap_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
